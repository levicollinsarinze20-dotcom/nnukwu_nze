<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>Order Received | SmartFix Autos</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f2;color:#151515;font-family:Arial,Helvetica,sans-serif;line-height:1.55}
    main{width:min(560px,100%);padding:40px 30px;background:#fff;border:1px solid #e7e7e3;border-radius:20px;text-align:center;box-shadow:0 16px 45px rgba(0,0,0,.08)}
    .check{width:64px;height:64px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;background:#eaf8ef;color:#1f9d55;font-size:34px;font-weight:900}
    h1{margin:0 0 12px;font-size:clamp(30px,7vw,42px);line-height:1.1}
    p{margin:0 0 24px;color:#555}
    a{display:inline-block;padding:14px 22px;border-radius:10px;background:#ff6a00;color:#fff;text-decoration:none;font-weight:900}
    a:focus-visible{outline:3px solid #151515;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="check" aria-hidden="true">✓</div>
    <h1>Thank you for your order</h1>
    <p>Your order has been submitted. SmartFix Autos will contact you to confirm your details and delivery.</p>
    <a href="air.html">Return to the store</a>
  </main>
</body>
</html>
